<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кружок</title>
<meta name="description" content="Знакомства по интересам: создавайте интересы, находите единомышленников и ходите на встречи.">
<style>
/* Шрифты лежат рядом с сайтом, поэтому он не зависит от чужих серверов. */
@font-face{font-family:'Onest';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/onest-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/onest-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:200 900;font-display:swap;src:url(fonts/unbounded-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:200 900;font-display:swap;src:url(fonts/unbounded-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Layout: один столбец до 1080px, липкая шапка сверху, на телефоне нижняя панель разделов. Фирменный мотив: пересекающиеся круги, как общие интересы. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEED; --fg:#14262B; --muted:#586A6F; --line:#D3DDDB;
  --accent:#0B7F75; --accent-fg:#FFFFFF; --accent-soft:#D5EEEA; --warm:#E8A33A; --danger:#B3392F; --danger-soft:#FBE4E1;
  --c1:oklch(.80 .12 190); --c2:oklch(.87 .12 80); --c3:oklch(.82 .11 10);
  --tint-l:.91; --tint-c:.07; --ink-l:.36; --ink-c:.1;
  --overlay:rgba(12,24,27,.5);
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1A1D; --surface:#162427; --surface-2:#1E3135; --fg:#E5EFED; --muted:#91A7AA; --line:#2A4044;
    --accent:#46CDBD; --accent-fg:#04211E; --accent-soft:#17383A; --warm:#F0B04A; --danger:#FF8F83; --danger-soft:#3A1E1C;
    --c1:oklch(.52 .11 190); --c2:oklch(.60 .11 75); --c3:oklch(.52 .12 10);
    --tint-l:.34; --tint-c:.06; --ink-l:.9; --ink-c:.08;
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--font-body);margin:0}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.meta{font-size:.875rem;color:var(--muted)}
.tint{background:oklch(var(--tint-l) var(--tint-c) var(--h,190));color:oklch(var(--ink-l) var(--ink-c) var(--h,190))}

.wrap{max-width:1080px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* шапка */
.top{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font:600 1.1rem var(--font-display)}
.nav{display:flex;gap:4px;flex:1;min-width:0}
.nav a{padding:.45em .95em;border-radius:999px;text-decoration:none;font-weight:600;color:var(--muted)}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.acct{margin-left:auto}
.me{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600}

/* кнопки и поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.62em 1.2em;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:.4em .9em;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:transparent}
.btn.warn{color:var(--danger)}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>span.lbl{font-weight:600;font-size:.9rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=date],input[type=time],select,textarea{font:inherit;width:100%;padding:.65em .85em;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:92px}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em}
.hint{font-size:.85rem;color:var(--muted)}
.notice{background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.banner{background:var(--danger-soft);color:var(--danger);border-radius:14px;padding:14px 16px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:.3em;flex:none;width:18px;height:18px;accent-color:var(--accent)}
details.more{font-size:.9rem;color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600}
details.more p{margin-top:8px}

/* аватары и значки */
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;font-weight:700}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-sm{width:28px;height:28px;font-size:.8rem}
.av-md{width:42px;height:42px;font-size:1.05rem}
.av-lg{width:92px;height:92px;font-size:2rem}
.badge{display:inline-grid;place-items:center;border-radius:50%;flex:none;font:600 1.1rem var(--font-display);width:46px;height:46px}
.badge.lg{width:76px;height:76px;font-size:1.8rem}
.chip{display:inline-block;padding:.15em .7em;border-radius:999px;font-size:.82rem;font-weight:600;text-decoration:none}
.going{display:flex}
.going .av{border:2px solid var(--surface);margin-left:-8px}
.going .av:first-child{margin-left:0}

/* заголовки */
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:500 clamp(1.5rem,3.2vw,2.1rem)/1.2 var(--font-display);text-wrap:balance}
h2{font:500 1.2rem/1.3 var(--font-display);text-wrap:balance}
h3{font-size:1.05rem;font-weight:650;line-height:1.3}
.lead{font-size:1.08rem;color:var(--muted);max-width:60ch}
.vhead,.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.section{margin-top:48px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.back:hover{color:var(--fg)}

/* главная */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-block:8px}
.hero-text{display:grid;gap:16px;justify-items:start;min-width:0}
.hero-art{width:100%;max-width:420px;height:auto;justify-self:center}
.hero-art .hc{fill-opacity:.82;stroke:var(--fg);stroke-opacity:.14}
.hero-art .c1{fill:var(--c1)}.hero-art .c2{fill:var(--c2)}.hero-art .c3{fill:var(--c3)}
.hero-art text{font-family:var(--font-body);font-weight:600;font-size:17px;fill:var(--fg)}
.hero-art .you{fill:var(--fg)}
.hero-art .you-t{fill:var(--bg);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.how-grid>div{border-top:2px solid var(--line);padding-top:14px;display:grid;gap:6px;min-width:0}
.how-grid .dot{width:14px;height:14px;border-radius:50%;margin-bottom:4px}

/* карточки интересов */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;align-content:space-between;min-width:0}
.icard:hover{border-color:var(--accent)}
.icard-main{display:grid;gap:8px;text-decoration:none;justify-items:start;min-width:0}
.icard-main p{color:var(--muted);font-size:.94rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.icard-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tools .search{flex:1;min-width:200px}

/* страница интереса */
.ihead{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:22px}
.ihead>div{display:grid;gap:6px;min-width:0}
.ihead .lead{overflow-wrap:anywhere}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs2 button{background:none;border:0;border-bottom:3px solid transparent;padding:.6em 1em;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs2 button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.topics{display:grid;gap:10px}
.topic{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.topic:hover{border-color:var(--accent)}
.topic-text,.comment p:last-child{white-space:pre-wrap;overflow-wrap:anywhere}
.topic-text{margin:12px 0}
.comments{display:grid;gap:16px;margin:18px 0}
.comment{display:flex;gap:12px;align-items:flex-start;min-width:0}
.comment>div{min-width:0}
.reply{display:grid;gap:10px;justify-items:start}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.person>div{display:grid;min-width:0}

/* встречи */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;align-items:end}
.fcount{margin:16px 0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mlist{display:grid;gap:12px}
.mcard{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.date{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-content:center;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.date b{font-size:1.3rem}
.date span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mbody{display:grid;gap:4px;justify-items:start;min-width:0}
.mbody h3,.mbody .meta{overflow-wrap:anywhere}
.maside{display:grid;gap:8px;justify-items:end}
.maside .meta{font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px;display:grid;gap:12px;justify-items:start}

/* профиль и формы */
.form{display:grid;gap:18px;max-width:520px}
.photo-pick{display:flex;align-items:center;gap:16px}
.pickbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:inline-block;padding:.5em 1.1em;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0}
.sw span.c{display:block;width:34px;height:34px;border-radius:50%;background:oklch(.72 .13 var(--h));border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw input:checked+span.c{box-shadow:0 0 0 2px var(--fg)}
.sw input:focus-visible+span.c{outline:2px solid var(--accent);outline-offset:3px}
.pro{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.pro>div{display:grid;gap:4px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps{display:grid;gap:10px;padding-left:1.2em;margin:0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);padding:.1em .4em;border-radius:6px;font-size:.9em}

/* окно и уведомление */
.overlay{position:fixed;inset:0;z-index:40;background:var(--overlay);display:grid;place-items:center;padding:16px;overflow:auto}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal form{display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:.7em 1.2em;border-radius:999px;font-weight:500;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{padding-block:0 32px;color:var(--muted);font-size:.85rem}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero-art{max-width:340px}
}
@media (max-width:720px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav a{text-align:center;padding:.6em .2em;font-size:.92rem}
  .wrap{padding-block:20px 24px}
  .foot{padding-bottom:96px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .ihead{grid-template-columns:auto 1fr}
  .ihead .btn{grid-column:1/-1;justify-self:start}
  .mcard{grid-template-columns:56px 1fr;gap:12px}
  .date{width:56px;height:56px}
  .maside{grid-column:1/-1;grid-auto-flow:column;justify-content:space-between;align-items:center;justify-items:start}
}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="#home" aria-label="Кружок, на главную">
      <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true"><circle cx="11" cy="14" r="9" fill="var(--accent)" fill-opacity=".85"/><circle cx="22" cy="14" r="9" fill="var(--warm)" fill-opacity=".85"/></svg>
      <span>Кружок</span>
    </a>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="acct" id="acct"></div>
  </div>
</header>

<main class="wrap" id="view"></main>
<footer class="wrap foot"><p>Кружок: тестовая версия сайта знакомств по интересам.</p></footer>

<div class="overlay" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h2 id="mt"></h2><button class="x" type="button" data-act="close" aria-label="Закрыть">&times;</button></div>
    <div id="mb"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------- настройки и подключение ---------- */
const CFG=window.KRUZHOK_CONFIG||{};
const URL_OK=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(CFG.url||'');
const KEY_OK=typeof CFG.key==='string'&&CFG.key.length>20&&!/[А-Яа-яЁё]/.test(CFG.key);
function keyProblem(k){
  if(/^sb_secret_/.test(k))return true;
  const p=String(k).split('.');
  if(p.length===3){try{const j=JSON.parse(atob(p[1].replace(/-/g,'+').replace(/_/g,'/')));if(j.role==='service_role')return true;}catch(e){}}
  return false;
}
const SECRET_KEY=KEY_OK&&keyProblem(CFG.key);
const LIB_OK=!!(window.supabase&&window.supabase.createClient);
const SB_OK=URL_OK&&KEY_OK&&!SECRET_KEY&&LIB_OK;
const BASE=URL_OK?CFG.url.replace(/\/+$/,''):'';
const sb=SB_OK?window.supabase.createClient(BASE,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;

/* ---------- вспомогательное ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,f)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b>1&&b<5)return f[1];if(b===1)return f[0];return f[2];};
const ageText=n=>n+' '+plural(n,['год','года','лет']);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const GENDER={any:'для всех',f:'только женщины',m:'только мужчины'};
const GHOST={name:'Пользователь',hue:200};
const CITIES=['Иркутск','Новосибирск','Москва','Санкт-Петербург','Екатеринбург','Казань'];
const HUES=[190,40,350,260,120,300];
const hueOf=id=>{let h=0;for(let k=0;k<String(id).length;k++)h=(h*31+String(id).charCodeAt(k))%360;return h;};
function ago(iso){
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60)return 'только что';
  const m=Math.floor(s/60);if(m<60)return m+' мин назад';
  const h=Math.floor(m/60);if(h<24)return h+' ч назад';
  const d=Math.floor(h/24);if(d===1)return 'вчера';
  if(d<7)return d+' '+plural(d,['день','дня','дней'])+' назад';
  return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
function errText(e){
  const m=(e&&e.message)||String(e||'');
  if(/Invalid login credentials/i.test(m))return 'Неверная почта или пароль.';
  if(/already registered|already been registered/i.test(m))return 'Эта почта уже зарегистрирована. Попробуйте войти.';
  if(/Password should be at least/i.test(m))return 'Пароль слишком короткий: нужно не меньше 6 символов.';
  if(/valid email|invalid format|Unable to validate email/i.test(m))return 'Проверьте адрес почты.';
  if(/rate limit|too many/i.test(m))return 'Слишком много попыток. Подождите немного и повторите.';
  if(e&&e.code==='23505')return 'Такой интерес уже есть. Найдите его в списке и вступите.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'Нет связи с сервером. Проверьте интернет и повторите.';
  if(/Database error saving new user/i.test(m))return 'Не удалось создать профиль. Проверьте, что вам есть 18 лет и все поля заполнены.';
  return m||'Что-то пошло не так. Повторите попытку.';
}
const safePhoto=u=>(u&&BASE&&String(u).indexOf(BASE+'/storage/v1/object/public/avatars/')===0)?u:null;

/* ---------- данные ---------- */
const state={session:null,me:null,view:'home',arg:null,tab:'talks',topic:null,q:'',onlyMine:false,f:{city:'',interest:'',gender:'',age:''},after:null,authMode:'signup',notice:'',photoFile:null,photoUrl:null,loaded:false,loadError:''};
let PEOPLE={},I=[],M=[];
const interest=id=>I.find(i=>i.id===id);
const who=id=>PEOPLE[id]||GHOST;
const has=arr=>!!(state.me&&arr.includes(state.me.id));
function clearData(){PEOPLE={};I=[];M=[];state.me=null;state.loaded=false;}

let loadSeq=0;
async function reload(){
  if(!state.session){clearData();return;}
  const seq=++loadSeq;
  const since=new Date(Date.now()-3*3600*1000).toISOString();
  const res=await Promise.all([
    sb.from('profiles').select('id,name,age,city,gender,about,photo_url'),
    sb.from('interests').select('id,title,description,hue,owner_id,created_at').order('created_at',{ascending:false}),
    sb.from('interest_members').select('interest_id,user_id'),
    sb.from('meetups').select('id,interest_id,title,city,place,starts_at,age_min,age_max,gender,max_people').gte('starts_at',since).order('starts_at',{ascending:true}),
    sb.from('meetup_going').select('meetup_id,user_id'),
    sb.from('topics').select('id,interest_id,author_id,title,body,created_at').order('created_at',{ascending:false}),
    sb.from('comments').select('id,topic_id,author_id,body,created_at').order('created_at',{ascending:true})
  ]);
  const bad=res.find(r=>r.error);
  if(bad)throw bad.error;
  if(seq!==loadSeq)return;
  const people={};
  res[0].data.forEach(p=>{people[p.id]={id:p.id,name:p.name,age:p.age,city:p.city,g:p.gender,about:p.about||'',photo:safePhoto(p.photo_url),hue:hueOf(p.id)};});
  const byI={};
  const ints=res[1].data.map(r=>{const o={id:r.id,title:r.title,desc:r.description,hue:r.hue,owner:r.owner_id,members:[],topics:[]};byI[o.id]=o;return o;});
  res[2].data.forEach(r=>{const o=byI[r.interest_id];if(o)o.members.push(r.user_id);});
  const byT={};
  res[5].data.forEach(r=>{const o=byI[r.interest_id];if(!o)return;const t={id:r.id,title:r.title,a:r.author_id,text:r.body||'',at:r.created_at,comments:[]};byT[t.id]=t;o.topics.push(t);});
  res[6].data.forEach(r=>{const t=byT[r.topic_id];if(t)t.comments.push({a:r.author_id,t:r.body,at:r.created_at});});
  const byM={};
  const meets=res[3].data.map(r=>{const o={id:r.id,interestId:r.interest_id,title:r.title,city:r.city,place:r.place,when:new Date(r.starts_at),ageMin:r.age_min,ageMax:r.age_max,g:r.gender,max:r.max_people,going:[]};byM[o.id]=o;return o;});
  res[4].data.forEach(r=>{const o=byM[r.meetup_id];if(o)o.going.push(r.user_id);});
  PEOPLE=people;I=ints;M=meets;
  state.me=people[state.session.user.id]||null;
  state.loaded=true;
}

function cardMeetup(m){
  const it=interest(m.interestId)||{title:'Интерес',hue:200,id:''};
  const d=m.when,going=has(m.going),full=m.going.length>=m.max;
  const month=d.toLocaleDateString('ru-RU',{month:'short'}).replace('.','');

  const time=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

  return '<article class="mcard"><div class="date"><b>'+d.getDate()+'</b><span>'+esc(month)+'</span></div>'+
    '<div class="mbody"><a class="chip tint" style="--h:'+esc(it.hue)+'" href="#interest-'+esc(it.id)+'">'+esc(it.title)+'</a>'+
    '<h3>'+esc(m.title)+'</h3>'+

    '<p class="meta">Возраст '+m.ageMin+'–'+m.ageMax+' · '+GENDER[m.g]+'</p></div>'+
    '<div class="maside"><div class="going">'+faces+'</div><span class="meta">'+m.going.length+' из '+m.max+'</span>'+
    '<button class="btn sm'+(going?' on':' primary')+'" type="button" data-act="join-meetup" data-id="'+esc(m.id)+'"'+(full&&!going?' disabled':'')+'>'+(going?'Вы идёте':(full?'Мест нет':'Пойду'))+'</button></div></article>';

/* ---------- фото ---------- */
function resizeImage(file,max){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error('Не удалось обработать фото.')),'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Не удалось открыть этот файл как изображение.'));};
    img.src=url;
  });
}
async function uploadAvatar(file){
  const uid=state.session.user.id;
  const blob=await resizeImage(file,512);
  const path=uid+'/'+Date.now()+'.jpg';
  const up=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',cacheControl:'3600'});
  if(up.error)throw up.error;
  const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
  const old=state.me&&state.me.photo;
  const upd=await sb.from('profiles').update({photo_url:url}).eq('id',uid);
  if(upd.error)throw upd.error;
  if(old){const k=old.indexOf('/avatars/');if(k>=0){try{sb.storage.from('avatars').remove([decodeURIComponent(old.slice(k+9))]);}catch(e){}}}
}

async function doLogin(){

  const r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return setErr(errText(r.error));

  await afterAuth('С возвращением!');
}
async function doSignup(){
  const email=$('#su-email').value.trim(),pw=$('#su-pw').value,name=$('#su-name').value.trim();
  const age=parseInt($('#su-age').value,10),city=$('#su-city').value,about=$('#su-about').value.trim();
  const gr=document.querySelector('input[name=sg]:checked');
  if(!email||email.indexOf('@')<1)return setErr('Введите адрес почты.');
  if(pw.length<6)return setErr('Пароль должен быть не короче 6 символов.');
  if(!name)return setErr('Введите имя.');
  if(!(age>=18))return setErr('Сайт для тех, кому есть 18 лет.');
  if(age>99)return setErr('Проверьте возраст.');
  if(!gr)return setErr('Выберите пол.');
  if(!$('#su-consent').checked)return setErr('Поставьте галочку согласия, чтобы продолжить.');
  const r=await sb.auth.signUp({email,password:pw,options:{data:{name,age,city,gender:gr.value,about}}});
  if(r.error)return setErr(errText(r.error));
  if(!r.data.session){
    state.notice='Мы отправили письмо на '+email+'. Перейдите по ссылке в нём, затем войдите.';
    state.authMode='login';render();return;
  }
  state.session=r.data.session;
  const file=state.photoFile;
  state.photoFile=null;state.photoUrl=null;
  if(file){
    try{await reload();await uploadAvatar(file);}
    catch(e){toast('Профиль создан, но фото загрузить не удалось. Попробуйте позже в профиле.');}
  }
  await afterAuth('Добро пожаловать, '+name.split(' ')[0]+'!');
}

async function createMeetup(){

  if(isNaN(when.getTime()))return setErr('Проверьте дату и время.');

async function sendReply(){
  const i=interest(state.arg),t=i&&i.topics.find(x=>x.id===state.topic),txt=$('#c-text').value.trim();
  if(!t)return;
  if(needUser())return;
  if(!has(i.members)){toast('Вступите в интерес, чтобы писать в обсуждениях.');return;}
  if(!txt){toast('Напишите сообщение.');return;}
  const r=await sb.from('comments').insert({topic_id:t.id,author_id:state.me.id,body:txt});
  if(r.error)throw r.error;
  await afterChange();
}

/* ---------- запуск ---------- */
async function init(){
  window.addEventListener('hashchange',route);
  if(SB_OK){
    try{const r=await sb.auth.getSession();state.session=r.data.session;}catch(e){}
    sb.auth.onAuthStateChange((ev,session)=>{
      state.session=session;
      if(ev==='SIGNED_OUT')setTimeout(()=>{clearData();render();},0);
    });
  }
  route();
}
init();
})();
</script>
