<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кружок</title>
<meta name="description" content="Знакомства по интересам: создавайте интересы, общайтесь в чатах и ходите на встречи.">
<meta name="theme-color" content="#0B7F75">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="#home" aria-label="Кружок, на главную">
      <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true"><circle cx="11" cy="14" r="9" fill="var(--accent)" fill-opacity=".85"/><circle cx="22" cy="14" r="9" fill="var(--warm)" fill-opacity=".85"/></svg>
      <span>Кружок</span>
    </a>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="acct" id="acct"></div>
  </div>
</header>

<main class="wrap" id="view"></main>
<footer class="wrap foot"><p><button type="button" class="lnk" data-act="install-help">Установить на телефон</button> · <button type="button" class="lnk" data-act="about">О сайте</button></p></footer>

<div class="overlay" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h2 id="mt"></h2><button class="x" type="button" data-act="close" aria-label="Закрыть">&times;</button></div>
    <div id="mb"></div>
  </div>
</div>
<div class="overlay ov2" id="ov2" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt2">
    <div class="mh"><h2 id="mt2">Выберите область фото</h2><button class="x" type="button" data-act="crop-cancel" aria-label="Закрыть">&times;</button></div>
    <div id="mb2"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="supabase.js"></script>
<script src="config.js?v=13"></script>
<script src="app.js?v=13"></script>
</body>
</html>
